version: "0.1"
profile: monorepo
repository:
  name: example-monorepo
  workspaces:
    - apps/*
    - packages/*
    - services/*
context:
  instructionFiles:
    - AGENTS.md
    - "apps/*/AGENTS.md"
    - "packages/*/AGENTS.md"
    - "services/*/AGENTS.md"
  loadRelevantOnly: true
workflows:
  default: workflows/feature.md
  directory: workflows
  skillsDirectory: skills
verification:
  test: "<affected-project test command>"
  build: "<affected-project build command>"
