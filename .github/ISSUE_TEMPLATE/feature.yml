name: Feature or improvement
description: Propose a focused improvement to the standard
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and why does it fit the standard?
    validations:
      required: true

