version: "0.1"
profile: monorepo
repository:
  workspaces:
    - apps/*
    - packages/*
    - services/*
context:
  instructionFiles:
    - AGENTS.md
    - "apps/*/AGENTS.md"
    - "packages/*/AGENTS.md"
    - "services/*/AGENTS.md"
  loadRelevantOnly: true
workflows:
  default: workflows/feature.md
  directory: workflows
  skillsDirectory: skills
verification:
  format: null
  lint: null
  typecheck: null
  test: null
  build: null
  security: null
